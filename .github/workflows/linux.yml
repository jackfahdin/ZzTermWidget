name: linux

on:
  push:
    branches: [ main ]
    tags:
      - V**
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          modules: 'qtmultimedia'
          aqtversion: ==3.1.7

      - name: Install prerequisites
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build libxcb-cursor0 libgtk-3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
