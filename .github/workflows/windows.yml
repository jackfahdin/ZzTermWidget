name: windows

on:
  push:
    branches: [ '**' ]
    tags:
      - V**
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows_mingw:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # QDir::temp() 重定向到 runner.temp：测试断言失败时落盘的对照 PNG 随之集中，便于上传
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: ctest --test-dir build --output-on-failure

      - name: Upload render dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-dumps-mingw
          path: |
            ${{ runner.temp }}/zzqtermwidget-*.png
            build/tests/*-qtest.log
          if-no-files-found: ignore

  windows_msvc:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          arch: 'win64_msvc2022_64'
          version: '6.8.2'
          modules: 'qtmultimedia'

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # offscreen 平台下该 Qt 走通用字体库（日志警告 Cannot find font directory），
      # 无字体可用时所有字符（含空格）渲染为 tofu 方框、字体度量退化，导致依赖
      # 真实字形/度量的断言假失败。按警告指引部署 DejaVu Sans Mono 到 Qt 字体目录
      - name: Deploy test font (DejaVu Sans Mono)
        shell: pwsh
        run: |
          $prefix = (qmake -query QT_INSTALL_PREFIX).Trim()
          $dst = Join-Path $prefix 'lib\fonts'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Invoke-WebRequest -Uri https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip -OutFile $env:RUNNER_TEMP\dejavu.zip
          Expand-Archive $env:RUNNER_TEMP\dejavu.zip -DestinationPath $env:RUNNER_TEMP\dejavu
          Copy-Item $env:RUNNER_TEMP\dejavu\dejavu-fonts-ttf-2.37\ttf\*.ttf $dst
          Get-ChildItem $dst

      - name: Test
        # QDir::temp() 重定向到 runner.temp：测试断言失败时落盘的对照 PNG 随之集中，便于上传
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Upload render dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: render-dumps-msvc
          path: |
            ${{ runner.temp }}/zzqtermwidget-*.png
            build/tests/*-qtest.log
          if-no-files-found: ignore
